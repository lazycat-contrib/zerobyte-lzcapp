application:
  subdomain: zerobyte
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://zerobyte:4096/
  injects:
    - id: zerobyte-capture-password
      auth_required: false
      on: request
      when:
        - /api/auth/sign-up/email
        - /api/auth/sign-in/username
        - /api/auth/change-password
      do: |
        const path = String(ctx.request.path || "");
        const method = String(ctx.request.method || "").toUpperCase();
        const isSupported =
          method === "POST" &&
          (path === "/api/auth/sign-up/email" ||
            path === "/api/auth/sign-in/username" ||
            path === "/api/auth/change-password");
        if (!isSupported) return;

        let payload = null;
        try {
          payload = ctx.body.getJSON();
        } catch {
          payload = null;
        }
        if (!payload || typeof payload !== "object") return;

        const username = typeof payload.username === "string" ? payload.username : "";
        const password =
          typeof payload.newPassword === "string"
            ? payload.newPassword
            : typeof payload.password === "string"
              ? payload.password
              : "";
        if (username) ctx.flow.set("zerobyte_pending_username", username);
        if (password) ctx.flow.set("zerobyte_pending_password", password);
    - id: zerobyte-commit-password
      auth_required: false
      on: response
      when:
        - /api/auth/sign-up/email
        - /api/auth/sign-in/username
        - /api/auth/change-password
      do: |
        if (ctx.status < 200 || ctx.status >= 300) return;

        const username = ctx.flow.get("zerobyte_pending_username");
        const password = ctx.flow.get("zerobyte_pending_password");
        if (typeof username === "string" && username.length > 0) {
          ctx.persist.set("zerobyte.username", username);
        }
        if (typeof password === "string" && password.length > 0) {
          ctx.persist.set("zerobyte.password", password);
        }
    - id: zerobyte-login-autofill
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: zerobyte.username
            password:
              $persist: zerobyte.password
            userSelector: "input[name='username']"
            passwordSelector: "input[name='password']"
services:
  zerobyte:
    # ghcr.io/nicotsx/zerobyte:v0.12.0
    # upstream: ghcr.io/nicotsx/zerobyte:v0.41.0
    image: registry.lazycat.cloud/czyt/nicotsx/zerobyte:df2e7177aa4aef86
    environment:
      - APP_SECRET={{ stable_secret "zerobyte_app_secret" }}
      - BASE_URL=https://{{ .S.AppDomain }}
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/sync_dir:/sync_dir
      - /lzcapp/var/backup:/var/lib/zerobyte
      - /lzcapp/var/rclone:/root/.config/rclone
